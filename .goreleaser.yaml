version: 2
project_name: pitpilot

builds:
  - id: pitpilot
    main: ./cmd/pitpilot
    binary: pitpilot
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: pitpilot
    ids: [pitpilot]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, FEATURES.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  prerelease: auto
