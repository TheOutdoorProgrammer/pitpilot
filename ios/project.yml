name: PitPilot
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.3"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  PitPilot:
    type: application
    platform: iOS
    sources: [PitPilot]
    info:
      path: PitPilot-Info.plist
      properties:
        CFBundleDisplayName: PitPilot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        PITPILOT_BASE_URL: $(PITPILOT_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theoutdoorprogrammer.pitpilot
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PITPILOT_BASE_URL: ""
  PitPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PitPilotTests]
    dependencies:
      - target: PitPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theoutdoorprogrammer.pitpilot.tests
        GENERATE_INFOPLIST_FILE: YES
  PitPilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PitPilotUITests]
    dependencies:
      - target: PitPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theoutdoorprogrammer.pitpilot.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PitPilot:
    build:
      targets:
        PitPilot: all
    test:
      targets: [PitPilotTests, PitPilotUITests]
