name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Verify optional snapshot extractor with synthetic data
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
        run: |
          dotnet restore tools/lubelogger-extract/LubeLoggerExtract.csproj --locked-mode
          dotnet build tools/lubelogger-extract/LubeLoggerExtract.csproj -c Release --no-restore
          dotnet tools/lubelogger-extract/bin/Release/net9.0/lubelogger-extract.dll --self-test
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: build --snapshot --clean
      - name: Build runtime image
        run: docker build --build-arg TARGETARCH=amd64 --tag pitpilot:ci .

  ios:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, mini-2, release, pitpilot]
    timeout-minutes: 45
    concurrency:
      group: pitpilot-ios
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Test native app
        run: bash scripts/test-ios.sh
      - name: Preserve synthetic native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitpilot-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/pitpilot-test-results/
          if-no-files-found: ignore
          retention-days: 7
